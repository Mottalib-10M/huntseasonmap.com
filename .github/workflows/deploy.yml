name: Daily rebuild and deploy

# Every day at 07:05 UTC (02:05 in New York): the home page and the tools start on the build day
# ("On <day>, deer season is open in N states"), so the site is rebuilt and published each day.
# No source is read here: the season dates are read by hand (src/data/seasons.json).
# Ce workflow est le seul qui publie le site : push sur main, tâche planifiée et lancement manuel.
# Modèle : canadaprocessingtimes.com/.github/workflows/update-data.yml (RECETTE, sites à données datées).
on:
  schedule:
    - cron: "5 7 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Tests
        run: npx vitest run

      - name: Build
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Checkout (script IndexNow)
        if: github.event_name != 'schedule'
        uses: actions/checkout@v4
      - name: Ping IndexNow
        if: github.event_name != 'schedule'
        continue-on-error: true
        run: bash scripts/indexnow.sh https://huntseasonmap.com
